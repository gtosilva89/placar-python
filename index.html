<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Reino da Lógica</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap">
<style>
/* Layout: HUD de RPG no topo, mapa em pixel art à esquerda, diário de viagem à direita; cenas em janela de diálogo estilo console 16-bit */
:root{
  --noite:#14112a; --painel:#221c40; --borda:#f2e9d8; --texto:#f2e9d8; --suave:#b8b0d6;
  --ouro:#ffcf4a; --vida:#ff5d73; --ok:#7ae582; --mana:#5ec8ff; --sombra:#0a0818;
  --f-tit:'Press Start 2P', ui-monospace, 'Courier New', monospace;
  --f-txt:'VT323', ui-monospace, 'Courier New', monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
button.som[aria-pressed="false"]{opacity:.6;text-decoration:line-through}
html,body{height:100%}
body{background:var(--noite);color:var(--texto);font-family:var(--f-txt);font-size:22px;line-height:1.15;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;}
*{box-sizing:border-box}
button{font-family:var(--f-txt);font-size:22px;color:var(--noite);background:var(--ouro);border:0;padding:8px 14px;cursor:pointer;
  box-shadow:0 4px 0 #b8860b, 0 0 0 3px var(--sombra);}
button:hover{filter:brightness(1.08)} button:active{transform:translateY(3px);box-shadow:0 1px 0 #b8860b,0 0 0 3px var(--sombra)}
button:focus-visible,input:focus-visible{outline:3px dashed var(--mana);outline-offset:3px}
button.sec{background:var(--suave);box-shadow:0 4px 0 #6f6894,0 0 0 3px var(--sombra)}
button:disabled{opacity:.45;cursor:not-allowed}
.px{border:3px solid var(--borda);box-shadow:0 0 0 3px var(--sombra),6px 6px 0 3px var(--sombra);background:var(--painel)}
h1,h2,h3{font-family:var(--f-tit);font-weight:400;text-wrap:balance;margin:0}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
/* HUD */
.hud{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;padding:10px 14px}
.hud h1{font-size:14px;color:var(--ouro);letter-spacing:1px}
.stat{display:flex;gap:8px;align-items:center;min-width:0}
.stat b{font-family:var(--f-tit);font-size:10px;color:var(--suave);font-weight:400}
.hearts{letter-spacing:2px;color:var(--vida);font-size:26px}
.xpbar{width:150px;height:14px;background:var(--sombra);border:2px solid var(--borda);position:relative}
.xpbar i{position:absolute;inset:0 auto 0 0;background:var(--mana);width:0}
.selos{display:flex;gap:6px;flex-wrap:wrap}
.selo{font-family:var(--f-tit);font-size:9px;background:var(--ouro);color:var(--noite);padding:4px 6px}
.hud .spacer{flex:1}
/* área principal */
.main{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px}
@media (max-width:860px){.main{grid-template-columns:minmax(0,1fr)}}
.mapa{position:relative;aspect-ratio:320/184;max-width:100%;padding:0}
.mapa canvas{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer}
.lbl{position:absolute;transform:translate(-50%,0);font-size:17px;padding:1px 6px;background:rgba(10,8,24,.82);color:var(--texto);
  white-space:nowrap;pointer-events:none;border:2px solid transparent}
.lbl.disp{border-color:var(--ouro);color:var(--ouro)} .lbl.feito{color:var(--ok)} .lbl.trava{color:#8a84a8}
@media (max-width:620px){.lbl{font-size:13px;padding:0 3px}}
.diario{padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.diario h2{font-size:11px;color:var(--ouro);margin-bottom:4px}
.lugar{display:flex;justify-content:space-between;gap:8px;align-items:center;background:transparent;color:var(--texto);box-shadow:none;padding:4px 6px;text-align:left;border:2px solid #3b3366;font-size:20px}
.lugar:hover{border-color:var(--ouro)} .lugar small{font-size:16px;color:var(--suave)}
.lugar.feito small{color:var(--ok)} .lugar.disp small{color:var(--ouro)}
.lugar:disabled{opacity:.5}
.dica{font-size:18px;color:var(--suave)}
/* cena */
.veu{position:fixed;inset:0;background:rgba(10,8,24,.78);display:flex;align-items:center;justify-content:center;z-index:20;
  padding:calc(12px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.cena{width:min(820px,100%);max-height:100%;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.cena h2{font-size:14px;color:var(--ouro);line-height:1.5}
.npc{display:flex;gap:14px;align-items:flex-start}
.npc canvas{width:96px;height:96px;image-rendering:pixelated;flex:none;border:3px solid var(--borda);background:#2d2655}
.fala{font-size:24px;min-width:0}
.fala .quem{font-family:var(--f-tit);font-size:10px;color:var(--mana);display:block;margin-bottom:6px}
.acoes{display:flex;gap:12px;flex-wrap:wrap;justify-content:flex-end}
.perg{border:3px dashed #e8d9a8;background:#f6ecd0;color:#3a2a14;padding:14px 16px;font-size:22px;line-height:1.2}
.perg h3{font-size:12px;color:#7a3d14;margin-bottom:10px;line-height:1.6}
.perg p{margin:0 0 8px} .perg .ex{background:#ead9a8;padding:8px;border-left:6px solid #b5442e}
.arena{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
@media (max-width:560px){.arena{grid-template-columns:minmax(0,1fr)}}
.arena canvas{width:120px;height:120px;image-rendering:pixelated;justify-self:center}
.hpb{height:14px;background:var(--sombra);border:2px solid var(--borda);position:relative;margin-top:6px}
.hpb i{position:absolute;inset:0 auto 0 0;background:var(--vida);transition:width .3s}
.ops{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:560px){.ops{grid-template-columns:minmax(0,1fr)}}
.ops button{background:var(--painel);color:var(--texto);box-shadow:0 0 0 3px var(--borda);text-align:left;font-size:21px;padding:10px 12px}
.ops button:hover{background:#2f2758}
.ops button.certo{background:#1f5f3a;box-shadow:0 0 0 3px var(--ok)} .ops button.errado{background:#6b1f2c;box-shadow:0 0 0 3px var(--vida)}
.fb{font-size:21px;padding:8px 10px;border-left:6px solid var(--mana);background:#1a1533}
.fb.ok{border-color:var(--ok)} .fb.no{border-color:var(--vida)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{background:var(--painel);color:var(--texto);box-shadow:0 0 0 3px #6f6894;font-size:21px}
.chip[aria-pressed="true"]{background:var(--mana);color:var(--noite);box-shadow:0 0 0 3px var(--borda)}
.regras{display:grid;gap:4px;font-size:20px}
.regras div{display:grid;grid-template-columns:58px minmax(0,1fr);gap:6px;background:#1a1533;padding:4px 8px}
.regras b{color:var(--ouro);font-family:var(--f-tit);font-size:9px;padding-top:5px}
.linha{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:center}
@media (max-width:560px){.linha{grid-template-columns:minmax(0,1fr)}}
select,input{font-family:var(--f-txt);font-size:22px;background:var(--sombra);color:var(--texto);border:3px solid var(--borda);padding:6px 8px;max-width:100%}
.tit-inicio{font-size:clamp(18px,4vw,34px);color:var(--ouro);line-height:1.4;text-shadow:4px 4px 0 var(--sombra)}
.avs{display:flex;gap:12px;flex-wrap:wrap}
.avs button{background:#2d2655;box-shadow:0 0 0 3px #6f6894;padding:6px}
.avs button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--ouro);background:#3b3366}
.avs canvas{width:64px;height:80px;image-rendering:pixelated;display:block}
.ficha table{width:100%;border-collapse:collapse;font-size:20px}
.ficha td,.ficha th{border-bottom:2px solid #3b3366;padding:4px 6px;text-align:left}
.ficha th{font-family:var(--f-tit);font-size:9px;color:var(--suave);font-weight:400}
.num{font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;font-family:var(--f-tit);font-size:11px;background:var(--ouro);color:var(--noite);padding:10px 14px;box-shadow:0 0 0 3px var(--sombra)}
.tremer{animation:tre .35s}
@keyframes tre{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-3px)}}
@media (prefers-reduced-motion:reduce){.tremer{animation:none}.hpb i{transition:none}}
.hud .dif{font-family:var(--f-tit);font-size:10px;background:var(--mana);color:var(--noite);padding:4px 6px}
.lbl.regiao{font-family:var(--f-tit);font-size:10px;padding:4px 6px;border-color:var(--borda)}
.lbl.regiao.trava{color:#8a84a8;border-color:#3b3366}
.reg{font-family:var(--f-tit);font-size:9px;color:var(--mana);margin-top:8px;display:flex;justify-content:space-between;align-items:center;gap:6px;line-height:1.5}
.reg.trava{color:#8a84a8}
.mini{font-size:16px;padding:2px 8px;box-shadow:0 2px 0 #b8860b,0 0 0 2px var(--sombra)}
.arte{width:100%;max-width:480px;aspect-ratio:96/54;image-rendering:pixelated;align-self:center;border:3px solid var(--borda)}
.tbw{overflow-x:auto;max-width:100%}
.tb{border-collapse:collapse;font-size:20px;min-width:100%}
.tb th,.tb td{border:2px solid #3b3366;padding:3px 8px;text-align:left;white-space:nowrap}
.tb th{background:#004f8b;color:#fff;font-weight:400}
.cod{background:#0a0818;color:#80ed99;border:2px solid #3b3366;padding:10px 12px;margin:0;font-family:ui-monospace,'Courier New',monospace;font-size:15px;line-height:1.35;overflow-x:auto;white-space:pre}
.nvs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:620px){.nvs{grid-template-columns:minmax(0,1fr)}}
.nv{border:3px solid var(--borda);padding:10px 12px;display:flex;flex-direction:column;gap:6px;background:#1a1533;min-width:0}
.nv.facil{border-color:var(--ok)} .nv.medio{border-color:var(--ouro)} .nv.dificil{border-color:var(--mana)} .nv.expert{border-color:#c77dff}
.nv.trava{opacity:.8;border-style:dashed}
.nvtop{display:flex;justify-content:space-between;gap:8px}
.nvn{font-family:var(--f-tit);font-size:12px;color:var(--ouro)}
.nvt{font-size:24px}
.fh{font-size:10px;color:var(--mana);margin:8px 0 4px;line-height:1.5}
summary{cursor:pointer;color:var(--suave)}
textarea.escreve{width:100%;font-family:var(--f-txt);font-size:22px;background:#0f0c22;color:var(--texto);border:3px solid var(--borda);padding:8px;resize:vertical}
textarea.cod{font-family:ui-monospace,Consolas,'Courier New',monospace;font-size:17px;color:#80ed99}
label.teste{display:flex;gap:8px;align-items:center;font-size:21px}
label.teste input{width:20px;height:20px}
.fala{white-space:pre-wrap}
.cena.largo{width:min(1280px,100%)}.codsalvo{font-family:monospace;font-size:34px;letter-spacing:3px;text-align:center;padding:14px;background:#fff8dc;color:#1a1533;border:4px dashed var(--ouro);word-break:break-all;user-select:all}.fala.alerta{border-color:#c53030;color:#ffd7d7}.ph{font-size:11px;color:var(--ouro);margin:14px 0 6px}.tag{display:inline-block;padding:1px 8px;color:#fff;font-size:18px}.calor td,.calor th{text-align:center;font-size:15px}.calor th{writing-mode:vertical-rl;transform:rotate(180deg);font-size:13px}.calor td:first-child{text-align:left}button.mini{font-size:15px;padding:2px 8px}.cena ol,.cena p{font-size:19px}
</style>
</head><body>
<div class="wrap">
  <header class="hud px" aria-label="Status do aventureiro">
    <h1>REINO DA LÓGICA</h1>
    <span class="dif" id="hDif">—</span>
    <div class="stat"><b>HERÓI</b><span id="hNome">—</span></div>
    <div class="stat"><b>VIDA</b><span class="hearts" id="hVida" aria-live="polite"></span></div>
    <div class="stat"><b>NÍVEL</b><span id="hNivel">—</span></div>
    <div class="stat"><b>XP</b><div class="xpbar" aria-hidden="true"><i id="hXpBar"></i></div><span class="num" id="hXp">0</span></div>
    <div class="selos" id="hSelos"></div>
    <div class="spacer"></div>
    <button class="sec" id="btnVisao" type="button" aria-pressed="false">Mapa completo</button>
    <button class="sec" id="btnNiveis" type="button">Níveis</button>
    <button class="sec" id="btnFicha" type="button">Ficha</button>
    <button class="sec" id="btnSalvar" type="button">Salvar 💾</button>
    <button class="sec" id="btnSair" type="button">Sair</button>
    <button class="sec som" id="btnFx" type="button" aria-pressed="true">Efeitos: sim</button>
    <button class="sec som" id="btnMus" type="button" aria-pressed="true">Música: sim</button>
  </header>
  <div class="main">
    <div class="mapa px" id="mapa"><canvas id="cv" width="320" height="184" aria-label="Mapa do nível"></canvas></div>
    <aside class="diario px" aria-label="Diário de viagem">
      <h2 id="dTit">DIÁRIO DE VIAGEM</h2>
      <div class="dica">Clique num lugar brilhando no mapa (ou aqui na lista) para viajar.</div>
      <div id="lista" style="display:flex;flex-direction:column;gap:6px"></div>
    </aside>
  </div>
</div>
<div class="veu" id="veu" hidden><div class="cena px" id="cena" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>
<script>
// ===================== DADOS: REINO DA LÓGICA (gerado por conteudo/gerar_dados.py; não edite à mão) =====================
const CARDS = [{"t": "Algoritmo", "p": ["Algoritmo é uma sequência de passos, em ordem, que resolve um problema. Receita de bolo, caminho para a escola e regra de um jogo são algoritmos.", "A ORDEM importa: colocar o miojo antes de ferver a água dá ruim. Cada passo vem na hora certa.", "Cada passo precisa ser claro, sem duas interpretações. O computador não adivinha: ele faz exatamente o que foi mandado.", "Todo algoritmo tem fim. Um passo que nunca termina trava o programa.", "Antes de programar, escreva o algoritmo em português. Depois é só traduzir para Python."], "ex": "O juiz segue passos: olhar os gols de cada time, comparar, decidir vitória, empate ou derrota, anunciar os pontos."}, {"t": "Entrada, processamento e saída", "p": ["Quase todo programa faz três coisas: ENTRADA (recebe dados), PROCESSAMENTO (faz contas e decisões) e SAÍDA (mostra o resultado).", "Em Python, a entrada mais comum é input(\"pergunta\"): o programa espera a pessoa digitar e apertar Enter.", "A saída mais comum é print(...): mostra algo na tela.", "O processamento fica no meio: contas, comparações, decisões e repetições.", "Pergunta-chave antes de programar: o que entra? o que eu faço com isso? o que sai?"], "ex": "Entram os gols dos dois times; o programa compara; sai o resultado e os pontos no placar."}, {"t": "Variáveis", "p": ["Variável é uma caixa com nome que guarda um valor. Exemplo: gols = 2 cria a caixa gols com o 2 dentro.", "O sinal = em Python quer dizer GUARDE. Não é \"igual\" da matemática: pontos = pontos + 3 pega o valor antigo, soma 3 e guarda de novo.", "Quando você guarda um valor novo, o antigo some. A caixa só guarda uma coisa de cada vez.", "Regras de nome: sem espaço (use _), sem acento, não começa com número, letras maiúsculas e minúsculas são diferentes (Gols e gols são caixas diferentes).", "Dê nomes que expliquem: gols_feitos é melhor que x."], "ex": "gols_feitos = 3, gols_sofridos = 1, time = \"1ºA\". Três caixas, três valores."}, {"t": "Tipos de dados", "p": ["int: número inteiro (3, -1, 0). float: número com vírgula, escrito com ponto (6.5). str: texto, sempre entre aspas (\"Ana\", \"3\"). bool: True ou False.", "ATENÇÃO: input() SEMPRE devolve texto (str), mesmo que a pessoa digite um número.", "\"2\" + \"2\" dá \"22\" (junta textos). 2 + 2 dá 4 (soma números).", "Para transformar texto em número: int(\"2\") vira 2; float(\"6.5\") vira 6.5. Para transformar em texto: str(10).", "Por isso o padrão é: gols = int(input(\"Gols: \"))."], "ex": "Sem int(), o programa acha que \"10\" é menor que \"9\" (compara como texto) e dá a vitória para o time errado!"}, {"t": "Operadores aritméticos", "p": ["+ soma, - subtrai, * multiplica, / divide (sempre dá float: 7 / 2 = 3.5).", "// divisão inteira (7 // 2 = 3) e % resto da divisão (7 % 2 = 1). Número par: n % 2 == 0.", "** potência (2 ** 3 = 8).", "Ordem das contas: primeiro parênteses, depois ** , depois * / // %, por último + -. Na dúvida, use parênteses.", "Exemplo: 4 / 3 * 3 * 100 dá 400.0, mas 4 / (3 * 3) * 100 dá 44.4. Os parênteses mudam tudo!"], "ex": "aproveitamento = pontos / (jogos * 3) * 100. Sem os parênteses, o resultado sai errado."}, {"t": "Comparações e lógica", "p": ["Comparações dão True ou False: > maior, < menor, >= maior ou igual, <= menor ou igual, == igual, != diferente.", "CUIDADO: = guarda um valor; == compara dois valores.", "and: True só se os DOIS lados forem True. or: True se PELO MENOS UM for True. not: inverte (not True = False).", "Tabela do and: V e V = V; V e F = F; F e V = F; F e F = F. Tabela do or: só dá F quando os dois são F.", "Exemplo: idade >= 15 and idade <= 17 testa se a idade está entre 15 e 17."], "ex": "Empate é gols_a == gols_b. Goleada é gols_a - gols_b >= 3. Jogo sem gols é gols_a == 0 and gols_b == 0."}, {"t": "Decisão: if, elif, else", "p": ["if testa uma condição: se for True, executa o bloco de baixo.", "elif (senão, se) testa outra condição quando a primeira deu False. Pode ter vários elif.", "else (senão) pega todo o resto. Não leva condição.", "Só UM bloco do if/elif/else é executado: o primeiro que der True.", "Depois da condição vêm dois-pontos (:) e o bloco fica recuado com 4 espaços. Recuo errado = IndentationError ou programa fazendo a coisa errada."], "ex": "if feitos > sofridos: pontos = 3 | elif feitos == sofridos: pontos = 1 | else: pontos = 0"}, {"t": "Repetição com for e range", "p": ["for repete um bloco um número CONHECIDO de vezes.", "range(5) gera 0, 1, 2, 3, 4 (cinco números, começando no 0).", "range(1, 4) gera 1, 2, 3: o range PARA ANTES do último número.", "Para repetir de 1 até n, incluindo o n: range(1, n + 1).", "O que fica recuado embaixo do for repete; o que está fora do recuo roda uma vez só, depois do laço."], "ex": "for jogo in range(1, jogos + 1): pergunta os gols do jogo 1, do jogo 2... até o último."}, {"t": "Repetição com while", "p": ["while repete ENQUANTO a condição for True. Usado quando não sabemos quantas vezes vai repetir.", "Alguma coisa dentro do laço precisa mudar a condição. Se nada mudar, vira LOOP INFINITO e o programa trava (Ctrl+C para parar).", "Uso clássico: validar entrada. Enquanto o valor for inválido, pergunte de novo.", "while True: repete para sempre, até encontrar um break (que sai do laço). É assim que se faz um menu.", "for = sei quantas vezes. while = repito até algo acontecer."], "ex": "gols = int(input(\"Gols: \")) e depois while gols < 0: gols = int(input(\"Não existe gol negativo: \"))"}, {"t": "Contador e acumulador", "p": ["Contador conta quantas vezes algo aconteceu: vitorias = vitorias + 1.", "Acumulador soma valores: pontos = pontos + 3 ou total = total + gols.", "Os dois COMEÇAM EM 0 e são criados ANTES do laço. Se o pontos = 0 ficar dentro do laço, ele é zerado a cada volta.", "O resultado final é mostrado DEPOIS do laço (fora do recuo).", "Forma curta: pontos += 3 é o mesmo que pontos = pontos + 3."], "ex": "Antes do for: pontos = 0. Dentro: soma os pontos de cada jogo. Depois: print do total."}, {"t": "Teste de mesa", "p": ["Teste de mesa é rodar o programa no papel, linha por linha, anotando o valor de cada variável numa tabela.", "Cada volta do laço vira uma linha da tabela. No fim, você sabe exatamente o que o programa vai mostrar.", "Tabela de testes: para cada teste, escreva a ENTRADA, o resultado ESPERADO (calculado por você) e o OBTIDO (o que o programa mostrou).", "Se o esperado for diferente do obtido, tem bug. O teste de mesa mostra em qual linha.", "Bons testes incluem casos estranhos: zero, empate, 10 contra 9, texto no lugar de número."], "ex": "Jogos 3x0, 2x2, 1x4: pontos 3, depois 4, depois 4. Saldo 3, 3, 0. Esperado: 4 pontos e saldo 0."}, {"t": "Funções", "p": ["Função é um bloco de código com nome, que pode ser usado várias vezes. Vocês já usaram nas aulas do professor: def e return.", "def calcular_pontos(feitos, sofridos): cria a função. feitos e sofridos são os PARÂMETROS (o que ela recebe).", "return devolve o resultado para quem chamou. Depois do return, a função termina.", "Chamar a função: p = calcular_pontos(2, 1) guarda 3 em p.", "Vantagem: a regra fica num lugar só. Mudou a regra? Muda só a função."], "ex": "calcular_pontos(1, 1) devolve 1. calcular_pontos(0, 3) devolve 0. O placar inteiro usa a mesma função."}, {"t": "Mensagens de erro", "p": ["Leia a ÚLTIMA linha do erro (o tipo) e procure o número da linha (line 12).", "SyntaxError / IndentationError: escrita errada ou recuo fora do lugar (dois-pontos faltando, parêntese aberto, espaços errados).", "NameError: nome que não existe (escreveu ponto em vez de pontos, ou usou antes de criar).", "ValueError: int(\"dois\") não dá para converter. TypeError: \"2\" + 2 mistura texto com número. ZeroDivisionError: divisão por zero.", "Erro de LÓGICA não tem mensagem: o programa roda, mas o resultado está errado. Só o teste encontra."], "ex": "O placar deu \"Derrota\" no 10x9? Não apareceu erro nenhum: é bug de lógica (faltou int)."}, {"t": "print, input e f-string", "p": ["print(\"Olá\") mostra um texto. print(\"Gols:\", 3) mostra os dois, separados por espaço.", "input(\"Seu nome: \") mostra a pergunta e espera a pessoa digitar. O que ela digitou volta como TEXTO.", "f-string: coloque um f antes das aspas e as variáveis entre chaves: print(f\"{time} fez {pontos} pontos\").", "Para mostrar com 1 casa decimal: f\"{aproveitamento:.1f}%\" mostra 44.4%.", "Texto sempre entre aspas. Sem aspas, o Python acha que é nome de variável (NameError)."], "ex": "print(f\"{time}: {pontos} pontos, saldo {saldo}\") mostra 1ºA: 4 pontos, saldo 0."}];

  saida.innerHTML=`<h3 class="ph">TURMA (${AL.length} alunos)</h3><div class="tbw"><table class="tb"><tr><th>Aluno</th><th>Salvo em</th><th>Último código</th><th>XP</th><th>Fase 1</th><th>Fase 2</th><th>Ind. 1</th><th>Ind. 2</th><th>Ind. 3</th><th>Atenção</th><th></th></tr>${linhas}</table></div>
  <h3 class="ph">BATALHAS QUE MAIS DERRUBARAM A TURMA</h3>${top.length?'<ol>'+top.map(([b,n])=>`<li>${escH(b.nome)} (${escH(b.conceito)}): ${n} erro(s) somados</li>`).join('')+'</ol>':'<p class="dica">Nenhum erro registrado.</p>'}
  <h3 class="ph">MAPA DE CALOR (erros por batalha)</h3><div class="dica">Verde = 0 ou 1 erro; laranja = 2 ou 3; vermelho = 4 ou mais; · = não concluída; escuro = fase não começada. Quem voltou por código aparece com 0, 2 ou 4+ (o código guarda a faixa).</div>
  <div class="tbw"><table class="tb calor"><tr><th>Aluno</th>${BAT.map(b=>`<th title="${escH(b.conceito)}">${escH(b.nome)}</th>`).join('')}</tr>${calor}</table></div>
  <div class="dica" style="margin-top:8px">A sugestão A/PA/NA vem do jogo. A menção é sua: confirme com a observação em sala e com o que o aluno escreveu (botão abrir). Os textos escritos só aparecem para quem salvou neste computador.</div>`;
  saida.querySelectorAll('button[data-i]').forEach(b=>b.onclick=()=>abrirRelProf(AL[+b.dataset.i]));
  saida.querySelectorAll('button[data-x]').forEach(b=>b.onclick=()=>{const S=AL[+b.dataset.x];if(b.dataset.ok){regGravar(regLer().filter(x=>normNome(x.nome)!==normNome(S.nome)));painelProf()}else{b.dataset.ok='1';b.textContent='confirmar?'}})}
 else saida.append(el('div',{class:'fala'},'Ninguém salvou neste computador ainda. Cole abaixo os nomes e códigos que os alunos anotaram.'));
